<title>Kill House Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --ground:#070b10;
  --wire:#6f94aa;
  --wire-hi:#b4d2e2;
  --team:#ffb547;
  --hostile:#ff5a47;
  --clear:#4fd38a;
  --text:#c9dbe6;
  --dim:#5f7687;
  --edge:#243847;
  --panel:rgba(7,11,16,.78);
}
html,body{height:100%}
body{background:var(--ground);color:var(--text);overflow:hidden;
  font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px;
  -webkit-user-select:none;user-select:none}
body.idle{cursor:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}

.hud{position:fixed;pointer-events:none;transition:opacity .5s}
body.nohud .hud{opacity:0}

.tl{top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;display:grid;gap:8px;max-width:calc(100vw - 32px - 150px)}
.brand{font-family:"Chakra Petch","Arial Narrow",sans-serif;font-weight:700;font-size:15px;letter-spacing:.24em;color:var(--wire-hi)}
.brand span{color:var(--team)}
.struct{font-size:10.5px;letter-spacing:.06em;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:repeat(2,auto);gap:6px 22px;margin:2px 0 0;justify-content:start}
.stats div{display:grid;gap:2px}
.stats dt{font-size:9.5px;letter-spacing:.14em;color:var(--dim)}
.stats dd{margin:0;font-size:13px;font-variant-numeric:tabular-nums;color:var(--text)}
.phase{font-family:"Chakra Petch","Arial Narrow",sans-serif;font-weight:600;font-size:12px;letter-spacing:.14em;color:var(--team);
  border-left:2px solid var(--team);padding-left:8px;min-height:15px}

.tr{top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;display:grid;gap:6px;justify-items:end}
#mm{width:210px;height:156px;display:block;background:rgba(7,11,16,.55);border:1px solid var(--edge)}
.legend{display:flex;gap:10px;font-size:9.5px;letter-spacing:.12em;color:var(--dim)}
.legend i{display:inline-block;width:7px;height:7px;margin-right:5px;vertical-align:0}

.log{bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:16px;margin:0;padding:0;list-style:none;display:grid;gap:3px;
  max-width:min(460px,calc(100vw - 32px));font-size:11px;font-variant-numeric:tabular-nums}
.log li{display:grid;grid-template-columns:auto 2.4em 1fr;gap:10px;color:var(--text);opacity:.9;white-space:nowrap}
.log li time{color:var(--dim)}
.log li b{font-weight:500;color:var(--team)}
.log li span{overflow:hidden;text-overflow:ellipsis}
.log li.sys b,.log li.sys span{color:var(--wire)}
.log li.kill span{color:#ffd9d4}
.log li.alert b{color:var(--hostile)}
.log li.alert span{color:#ffb4a8}
.log li.clr span{color:var(--clear)}

.ctrl{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;
  max-width:min(540px,calc(100vw - 32px));transition:opacity .45s}
body.idle .ctrl{opacity:0;pointer-events:none}
.ctrl button{font:500 11px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--text);
  background:var(--panel);border:1px solid var(--edge);padding:10px 12px;cursor:pointer}
.ctrl button b{font-weight:500;color:var(--team);margin-left:4px}
.ctrl button:hover{border-color:var(--wire)}
.ctrl button:focus-visible{outline:1px solid var(--team);outline-offset:2px}
.ctrl button[aria-pressed="false"] b{color:var(--dim)}
.keys{flex-basis:100%;text-align:right;font-size:10px;letter-spacing:.06em;color:var(--dim)}

.banner{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .8s;
  display:grid;gap:10px;justify-items:center;width:calc(100vw - 32px)}
.banner.on{opacity:1}
.banner .big{font-family:"Chakra Petch","Arial Narrow",sans-serif;font-weight:700;font-size:clamp(26px,5.4vw,60px);letter-spacing:.2em;color:var(--clear);
  text-shadow:0 0 24px rgba(79,211,138,.25);text-wrap:balance}
.banner .sm{font-size:12px;letter-spacing:.18em;color:var(--wire-hi);font-variant-numeric:tabular-nums}
.banner .rule{width:min(420px,70vw);height:1px;background:linear-gradient(90deg,transparent,var(--clear),transparent)}

@media (max-width:640px){
  #mm{width:132px;height:100px}
  .legend{display:none}
  .tl{max-width:calc(100vw - 32px - 142px)}
  .stats{grid-template-columns:repeat(2,auto)}
  .log{font-size:10px}
  .log li{grid-template-columns:2.2em 1fr}
  .log li time{display:none}
  body:not(.idle) .log{opacity:0}
  .keys{display:none}
}
</style>
